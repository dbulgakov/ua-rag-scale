[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "raglab"
version = "1.0.0"
description = "Retrieval degradation with corpus growth in RAG and how to compensate for it"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
  "bm25s>=0.3.16",
  "datasets>=4",
  "diskcache>=5.6",
  "faiss-cpu>=1.10",
  "fastapi>=0.115",
  "hnswlib>=0.8",
  "huggingface-hub>=0.29",
  "matplotlib>=3.9",
  "mwsql>=1.0.4",
  "nltk>=3.10.4",
  "numpy>=2",
  "openai>=1.60",
  "pandas>=2.2",
  "peft>=0.15",
  "pooch>=1.8",
  "pyarrow>=19",
  "pymorphy3==2.0.6",
  "pymorphy3-dicts-uk==2.4.1.1.1663094765",
  "scikit-learn>=1.6",
  "scipy>=1.14",
  "sentence-transformers>=4",
  "tabulate>=0.9",
  "torch>=2.6",
  "transformers>=4.49",
  "typer>=0.15",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
mlx = ["mlx-lm>=0.30; sys_platform == 'darwin'"]

[project.scripts]
raglab = "raglab.cli:app"

[dependency-groups]
dev = ["networkx>=3.4", "pytest>=8", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
raglab = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PERF", "RUF", "ANN"]
ignore = ["RUF001", "RUF002", "RUF003", "ANN401"]
